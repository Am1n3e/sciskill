name: SciSkill paper preview
description: Publish PR paper previews and remove their PDFs after merge from trusted workflows.
inputs:
  mode:
    description: publish for workflow_run events, or cleanup for merged PRs.
    default: publish
  pull-request:
    description: Merged PR number for manual cleanup; closed events use their own PR number.
    default: ''
  github-token:
    description: Token with Actions write and pull requests write permissions; use an installation token for a custom App identity.
    default: ${{ github.token }}
  bot-login:
    description: Login belonging to the supplied token (for example sciskill[bot]).
    default: github-actions[bot]
  workflow:
    description: Trusted path of the workflow that generated the paper artifacts.
    default: .github/workflows/paper-diff.yml
runs:
  using: composite
  steps:
    - name: Publish preview links
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SCISKILL_ACTION_PATH: ${{ github.action_path }}
        SCISKILL_PREVIEW_WORKFLOW: ${{ inputs.workflow }}
        SCISKILL_BOT_LOGIN: ${{ inputs.bot-login }}
        SCISKILL_PREVIEW_MODE: ${{ inputs.mode }}
        SCISKILL_PULL_NUMBER: ${{ inputs.pull-request }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const options = {github, context, core,
            workflow: process.env.SCISKILL_PREVIEW_WORKFLOW,
            botLogin: process.env.SCISKILL_BOT_LOGIN};
          if (process.env.SCISKILL_PREVIEW_MODE === 'publish') {
            await require(process.env.SCISKILL_ACTION_PATH + '/publish.cjs')(options);
          } else if (process.env.SCISKILL_PREVIEW_MODE === 'cleanup') {
            if (context.eventName !== 'workflow_dispatch'
                && !(context.eventName === 'pull_request_target' && context.payload.action === 'closed')) {
              throw new Error('Cleanup requires a closed pull_request_target event or workflow_dispatch.');
            }
            const pullNumber = context.eventName === 'workflow_dispatch'
              ? Number(process.env.SCISKILL_PULL_NUMBER) : context.payload.pull_request.number;
            await require(process.env.SCISKILL_ACTION_PATH + '/cleanup.cjs')({...options, pullNumber});
          } else {
            throw new Error('Unknown preview mode. Use publish or cleanup.');
          }
