[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "science-skills-rebuttal-desk"
version = "0.1.0"
description = "Local review, analysis, and rebuttal response workspace"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Markdown>=3.7,<4", "bleach>=6.2,<7", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "markdownify>=1,<2"]

[project.scripts]
rebuttal-desk = "rebuttal_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rebuttal_desk"]

[tool.ruff.lint]
extend-select = ["C90"]
[tool.ruff.lint.mccabe]
max-complexity = 10
